name: Deploy (Kubernetes)

on:
  workflow_call:
    inputs:
      env_name:
        description: "Environment name (staging/dev/prod)"
        required: true
        type: string
      service_name:
        description: "Service name (frontend/backend)"
        required: true
        type: string
      image_tag:
        description: "Image tag to deploy (optional). If empty, only applies manifests."
        required: false
        type: string
      kustomize_dir:
        description: "Kustomize dir to apply (optional). Default derived from service_name/env_name."
        required: false
        type: string
      namespace:
        description: "Kubernetes namespace (optional). Used for set image / rollout."
        required: false
        type: string
      deployment_name:
        description: "Kubernetes Deployment name (optional). Used for set image / rollout."
        required: false
        type: string
      container_name:
        description: "Container name inside the Deployment (optional). Used for set image."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}

    env:
      ENV_NAME: ${{ inputs.env_name }}
      SERVICE_NAME: ${{ inputs.service_name }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout manifests repo (caller)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Resolve variables (paths/cluster/roles)
        id: cfg
        shell: bash
        run: |
          set -euo pipefail

          # Kustomize dir default
          if [[ -n "${{ inputs.kustomize_dir }}" ]]; then
            KUSTOMIZE_DIR="${{ inputs.kustomize_dir }}"
          else
            # Default kustomize dir: support both patterns used across repos
            # - k8s/overlays/<env>
            # - k8s/overlay/<env>
            if [[ -d "k8s/overlays/${ENV_NAME}" ]]; then
              KUSTOMIZE_DIR="k8s/overlays/${ENV_NAME}"
            elif [[ -d "k8s/overlay/${ENV_NAME}" ]]; then
              KUSTOMIZE_DIR="k8s/overlay/${ENV_NAME}"
            else
              echo "Could not find kustomize overlay dir for env=${ENV_NAME}." >&2
              echo "Tried: k8s/overlays/${ENV_NAME} and k8s/overlay/${ENV_NAME}" >&2
              echo "You can pass inputs.kustomize_dir to override." >&2
              exit 1
            fi
          fi

          CLUSTER_NAME="slack-enterprise-study-${ENV_NAME}-use1-eks"

          case "${ENV_NAME}" in
            staging)
              ROLE_KUBECONFIG="${{ secrets.AWS_ROLE_ARN_EKS_KUBECONFIG_STAGING }}"
              ROLE_KUBECTL="${{ secrets.AWS_ROLE_ARN_EKS_KUBECTL_STAGING }}"
              ;;
            dev)
              ROLE_KUBECONFIG="${{ secrets.AWS_ROLE_ARN_EKS_KUBECONFIG_DEV }}"
              ROLE_KUBECTL="${{ secrets.AWS_ROLE_ARN_EKS_KUBECTL_DEV }}"
              ;;
            prod)
              ROLE_KUBECONFIG="${{ secrets.AWS_ROLE_ARN_EKS_KUBECONFIG_PROD }}"
              ROLE_KUBECTL="${{ secrets.AWS_ROLE_ARN_EKS_KUBECTL_PROD }}"
              ;;
            *)
              echo "Unknown env_name=${ENV_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ -z "${ROLE_KUBECONFIG}" || -z "${ROLE_KUBECTL}" ]]; then
            echo "Missing role secret for env=${ENV_NAME}" >&2
            exit 1
          fi

          NAMESPACE="${{ inputs.namespace }}"
          DEPLOYMENT_NAME="${{ inputs.deployment_name }}"
          CONTAINER_NAME="${{ inputs.container_name }}"

          echo "kustomize_dir=${KUSTOMIZE_DIR}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${CLUSTER_NAME}" >> "$GITHUB_OUTPUT"
          echo "role_kubeconfig=${ROLE_KUBECONFIG}" >> "$GITHUB_OUTPUT"
          echo "role_kubectl=${ROLE_KUBECTL}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "deployment_name=${DEPLOYMENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "container_name=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC - kubeconfig role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.cfg.outputs.role_kubeconfig }}
          audience: sts.amazonaws.com

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Update kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "${{ steps.cfg.outputs.cluster_name }}" \
            --region "${AWS_REGION}"

      - name: Configure AWS credentials (OIDC - kubectl role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.cfg.outputs.role_kubectl }}
          audience: sts.amazonaws.com

      - name: Apply manifests (kustomize)
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.cfg.outputs.kustomize_dir }}"
          echo "Applying: ${DIR}"
          kubectl kustomize "${DIR}" | kubectl apply -f -

      - name: Update Deployment image (optional)
        if: ${{ inputs.image_tag != '' && inputs.image_tag != 'KEEP_CURRENT_IMAGE' && steps.cfg.outputs.namespace != '' && steps.cfg.outputs.deployment_name != '' && steps.cfg.outputs.container_name != '' }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.image_tag }}"
          NS="${{ steps.cfg.outputs.namespace }}"
          DEP="${{ steps.cfg.outputs.deployment_name }}"
          CTR="${{ steps.cfg.outputs.container_name }}"

          ECR_REPO="slack-enterprise-study-${ENV_NAME}-use1-${SERVICE_NAME}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${TAG}"

          echo "Setting image: ${NS} deployment/${DEP} ${CTR}=${IMAGE_URI}"
          kubectl -n "${NS}" set image "deployment/${DEP}" "${CTR}=${IMAGE_URI}"

      - name: Decide if rollout should run
        id: rollout
        if: ${{ steps.cfg.outputs.namespace != '' && steps.cfg.outputs.deployment_name != '' }}
        shell: bash
        run: |
          set -euo pipefail

          NS="${{ steps.cfg.outputs.namespace }}"
          DEP="${{ steps.cfg.outputs.deployment_name }}"

          # If the Deployment does not exist yet (first apply), kubectl may fail here.
          # In that case, we skip rollout to avoid failing the pipeline.
          IMAGE=$(kubectl -n "${NS}" get deploy "${DEP}" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)

          # Heuristics for "placeholder / invalid" image strings
          # (adjust patterns later if you have a specific placeholder convention)
          if [[ -z "${IMAGE}" ]]; then
            echo "Rollout will be skipped: Deployment has no image yet (likely first apply)." >&2
            echo "should_rollout=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "${IMAGE}" | grep -Eqi '(changeme|replace|todo|<image>|IMAGE_TAG|KEEP_CURRENT_IMAGE)'; then
            echo "Rollout will be skipped: Deployment image looks like a placeholder: ${IMAGE}" >&2
            echo "should_rollout=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected Deployment image: ${IMAGE}"
          echo "should_rollout=true" >> "$GITHUB_OUTPUT"

      - name: Rollout status (optional)
        if: ${{ steps.cfg.outputs.namespace != '' && steps.cfg.outputs.deployment_name != '' && steps.rollout.outputs.should_rollout == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${{ steps.cfg.outputs.namespace }}" rollout status "deployment/${{ steps.cfg.outputs.deployment_name }}" --timeout=300s

      - name: Print LoadBalancer DNS
        shell: bash
        run: |
          set -euo pipefail

          SVC_NS="ingress-nginx"
          SVC_NAME="ingress-nginx-controller"

          LB_HOSTNAME=$(kubectl -n "${SVC_NS}" get svc "${SVC_NAME}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true)

          if [[ -z "${LB_HOSTNAME}" ]]; then
            echo "LoadBalancer DNS not available yet for ${SVC_NS}/${SVC_NAME}."
            exit 0
          fi

          echo "LoadBalancer DNS:"
          echo "${LB_HOSTNAME}"
